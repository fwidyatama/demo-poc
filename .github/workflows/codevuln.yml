name: codevuln
on: pull_request
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  scan:
    # self-hosted runner: only for branches of this repository, never for a fork's pull request
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, codevuln]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: codevuln-ci --timeout 45
        env:
          GITHUB_TOKEN: ${{ github.token }}
