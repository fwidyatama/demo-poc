name: smartx
on: pull_request
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  scan:
    # self-hosted runner: only for branches of this repository, never for a fork's pull request
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, smartx]
    # SMARTX_TOKEN (secret), SMARTX_URL and optional SMARTX_WEB_URL (variables) live in this environment; no deployment is recorded
    environment:
      name: smartx
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: smartx-ci --timeout 45
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMARTX_URL: ${{ vars.SMARTX_URL }}
          SMARTX_WEB_URL: ${{ vars.SMARTX_WEB_URL }}
          SMARTX_TOKEN: ${{ secrets.SMARTX_TOKEN }}
